<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Pernikahan</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="card shadow">
          <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Form Undangan Pernikahan</h4>
          </div>
          <div class="card-body">
            
            <div class="mb-3">
              <label for="nohp" class="form-label">No HP</label>
              <input type="text" id="nohp" class="form-control" placeholder="contoh: 081234567890">
            </div>

            <div class="mb-3">
              <label for="nama" class="form-label">Nama Tamu</label>
              <input type="text" id="nama" class="form-control" placeholder="Nama Tamu">
            </div>

            <div class="mb-3">
              <label for="pasangan" class="form-label">Nama Pasangan</label>
              <input type="text" id="pasangan" class="form-control" value="I Ketut Sunarta & Ni Komang Mina"  readonly>
            </div>

            <div class="mb-3">
              <label for="linkBase" class="form-label">Link Undangan (tanpa ?to=)</label>
              <input type="text" id="linkBase" class="form-control" value="https://gurubaru.github.io/sunarta-mina/" readonly>
            </div>

            <div class="d-flex gap-2 mb-3">
              <button class="btn btn-info" onclick="ambilKontak()">Ambil dari Kontak</button>
              <button class="btn btn-success" onclick="kirimWA()">Kirim ke WhatsApp</button>
            </div>

            <hr>
            <h5 class="mt-3">Preview Pesan:</h5>
            <div id="preview" class="border rounded p-3 bg-light" style="white-space: pre-line;"></div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const namaInput = document.getElementById("nama");
    const pasanganInput = document.getElementById("pasangan");
    const nohpInput = document.getElementById("nohp");
    const linkBaseInput = document.getElementById("linkBase");
    const previewDiv = document.getElementById("preview");

    let pesanWA = ""; // pesan asli untuk WA

    namaInput.addEventListener("input", updatePesan);
    pasanganInput.addEventListener("input", updatePesan);
    nohpInput.addEventListener("input", formatNoHP);
    linkBaseInput.addEventListener("input", updatePesan);

    function formatNoHP() {
      let nohp = nohpInput.value.trim();
      if (nohp.startsWith("0")) {
        nohp = "62" + nohp.substring(1);
        nohpInput.value = nohp;
      }
    }

    function updatePesan() {
      const nama = namaInput.value.trim();
      const pasangan = pasanganInput.value.trim();
      const namaLink = nama.replace(/\s+/g, "+");
      const baseLink = linkBaseInput.value.trim();
      const linkUndangan = `${baseLink}?to=${namaLink}`;

      // Pesan untuk WA (pakai *nama* dan *pasangan*)
      pesanWA = `Kepada Yth.
Bapak/Ibu/Saudara/i
*${nama}*

*OM SWASTYASTU*,

Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i, teman sekaligus sahabat, untuk menghadiri acara pernikahan kami :
*${pasangan}*

Berikut link undangan kami untuk info lengkap dari acara bisa kunjungi :

${linkUndangan}

Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan doa restu.

Mohon maaf perihal undangan hanya di bagikan melalui pesan ini. 

Terima kasih banyak atas perhatiannya.

*OM SHANTI, SHANTI, SHANTI, OM*`;

      // Preview (pakai <b>nama</b> dan <b>pasangan</b>, link jadi <a>)
      const pesanPreview = `Kepada Yth.
Bapak/Ibu/Saudara/i
<b>${nama}</b>

<b>OM SWASTYASTU</b>,

Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i, teman sekaligus sahabat, untuk menghadiri acara pernikahan kami :
<b>${pasangan}</b>

Berikut link undangan kami untuk info lengkap dari acara bisa kunjungi :

<a href="${linkUndangan}" target="_blank">${linkUndangan}</a>

Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan doa restu.

Mohon maaf perihal undangan hanya di bagikan melalui pesan ini. 

Terima kasih banyak atas perhatiannya.

<b>OM SHANTI, SHANTI, SHANTI, OM</b>`;

      previewDiv.innerHTML = pesanPreview;
    }

    function kirimWA() {
      formatNoHP(); // pastikan nomor sudah diformat
      const nohp = nohpInput.value.trim();

      if (!nohp || !pesanWA) {
        alert("Nomor HP, Nama, Pasangan, dan Link harus diisi!");
        return;
      }

      const url = `https://wa.me/${nohp}?text=${encodeURIComponent(pesanWA)}`;
      window.open(url, "_blank");
    }

    async function ambilKontak() {
      if ('contacts' in navigator && 'select' in navigator.contacts) {
        try {
          const kontak = await navigator.contacts.select(['name', 'tel'], {multiple: false});
          if (kontak.length > 0) {
            if (kontak[0].name && kontak[0].name.length > 0) {
              namaInput.value = kontak[0].name[0];
            }
            if (kontak[0].tel && kontak[0].tel.length > 0) {
              nohpInput.value = kontak[0].tel[0];
              formatNoHP();
            }
            updatePesan();
          }
        } catch (err) {
          console.error("Gagal ambil kontak:", err);
          alert("Tidak bisa ambil kontak. Pastikan browser mendukung Contact Picker API.");
        }
      } else {
        alert("Browser belum mendukung Contact Picker API.");
      }
    }
  </script>
</body>
</html>
